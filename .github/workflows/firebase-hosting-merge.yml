# This file was auto-generated by the Firebase CLI
# https://github.com/firebase/firebase-tools

name: Deploy to Firebase Hosting on merge
on:
  push:
    branches:
      - main
permissions:
  checks: write
  contents: read
  pull-requests: write
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npm ci && npm run build
        env:
          # Admin SDK credential (service account JSON) so build-time Firestore
          # reads bypass App Check. Reuses the same service account as the deploy
          # step below. Without it, blog/landing-page/AEO reads fall back or fail.
          FIREBASE_SERVICE_ACCOUNT_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_GUIANEGOCIOS_PROD }}
          # Kept for the client-SDK fallback path (App Check is ENFORCED on
          # Firestore; reCAPTCHA cannot run in Node).
          APP_CHECK_DEBUG_TOKEN: ${{ secrets.APP_CHECK_DEBUG_TOKEN }}
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_GUIANEGOCIOS_PROD }}
          channelId: live
          projectId: guianegocios-prod
      - name: Smoke test production
        # Fails the run if the live site regressed: 404 handling, wildcard slug
        # validation, sitemap links, editor attributes leaking, or analytics
        # loading without consent. Each check maps to a breakage found in prod.
        run: node scripts/smoke-test-production.mjs
      - name: Ping IndexNow (Bing instant indexing)
        run: bash scripts/ping-indexnow.sh
