name: Deploy to Firebase Hosting on PR
on: pull_request
permissions:
  checks: write
  contents: read
  pull-requests: write
jobs:
  build_and_preview:
    # Dependabot PRs get no repository secrets, so the build-time Firestore
    # reads fail and the preview job can never go green. Skip them instead of
    # reporting a permanent failure; their lockfile diff is covered by
    # `npm audit` locally and by the merge build.
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npm ci && npm run build
        env:
          # Admin SDK credential (service account JSON) so build-time Firestore
          # reads bypass App Check. Reuses the same service account as the deploy
          # step below. Without it, blog/landing-page/AEO reads fall back or fail.
          FIREBASE_SERVICE_ACCOUNT_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_GUIANEGOCIOS_PROD }}
          # Kept for the client-SDK fallback path.
          APP_CHECK_DEBUG_TOKEN: ${{ secrets.APP_CHECK_DEBUG_TOKEN }}
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_GUIANEGOCIOS_PROD }}
          projectId: guianegocios-prod
